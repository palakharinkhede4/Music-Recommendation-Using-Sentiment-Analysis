name: Keep Streamlit App Alive

on:
  schedule:
    # Runs every 6 hours to keep Streamlit Community Cloud from sleeping
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  ping-streamlit:
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive ping to Streamlit App
        run: |
          APP_URL="${{ secrets.STREAMLIT_APP_URL }}"
          if [ -z "$APP_URL" ]; then
            APP_URL="https://moodbeat-ai.streamlit.app"
          fi
          echo "Pinging Streamlit App at: $APP_URL"
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" -L "$APP_URL")
          echo "HTTP Response Status Code: $STATUS_CODE"
          if [ "$STATUS_CODE" -ge 200 ] && [ "$STATUS_CODE" -lt 400 ]; then
            echo "Successfully pinged app! Streamlit Cloud activity timer updated."
          else
            echo "Ping sent. HTTP status: $STATUS_CODE"
          fi
